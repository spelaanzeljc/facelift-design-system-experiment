<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screen Assembly Scratchpad</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111317;--surf:#1c1f26;--surf2:#252932;--surf3:#2e3340;
  --border:#2e3340;--border2:#3d4454;
  --text:#e8eaf0;--muted:#6b7280;--dim:#3d4454;
  --blue:#1339ec;--blue-h:#0f2ebd;
  --font:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --r:8px;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── Header ── */
.header{display:flex;align-items:center;gap:12px;padding:0 16px;height:44px;border-bottom:1px solid var(--border);flex-shrink:0}
.header h1{font-size:13px;font-weight:600}
.header .sub{font-size:11px;color:var(--muted)}
.header-right{margin-left:auto;display:flex;gap:6px}
.hbtn{background:var(--surf2);border:1px solid var(--border2);color:var(--muted);font-family:var(--font);font-size:11px;padding:4px 10px;border-radius:5px;cursor:pointer;transition:all .15s}
.hbtn:hover{color:var(--text);border-color:var(--muted)}
.hbtn.active{background:var(--blue);border-color:var(--blue);color:#fff}

/* ── Body layout ── */
.body{display:flex;flex:1;min-height:0}

/* ── Left sidebar ── */
.sidebar{width:236px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--border)}
.stab{flex:1;background:none;border:none;color:var(--muted);font-family:var(--font);font-size:12px;padding:9px 0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.stab.active{color:var(--text);border-bottom-color:var(--blue)}
.stab:hover:not(.active){color:var(--text)}

.pane{flex:1;overflow-y:auto;display:none}
.pane.active{display:flex;flex-direction:column}

/* Component browser */
.cat-filter{display:flex;flex-wrap:wrap;gap:4px;padding:10px 10px 6px}
.cat-btn{background:none;border:1px solid var(--border2);color:var(--muted);font-family:var(--font);font-size:10px;padding:3px 8px;border-radius:100px;cursor:pointer;transition:all .15s;white-space:nowrap}
.cat-btn:hover{color:var(--text);border-color:var(--muted)}
.cat-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}

.comp-list{padding:4px 6px 10px;display:flex;flex-direction:column;gap:2px}
.comp-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:6px;cursor:pointer;transition:background .12s;border:1px solid transparent}
.comp-item:hover{background:var(--surf2)}
.comp-item.flash{background:rgba(19,57,236,.15);border-color:rgba(19,57,236,.3)}
.comp-icon{width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.comp-meta{flex:1;min-width:0}
.comp-name{font-size:12px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-cat{font-size:10px;color:var(--muted)}
.comp-add{width:20px;height:20px;background:var(--blue);border-radius:4px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s;flex-shrink:0}
.comp-item:hover .comp-add{opacity:1}

/* Layers panel */
.layers-empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.5}
.layer-list{padding:6px;display:flex;flex-direction:column;gap:2px}
.layer-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;border:1px solid transparent;cursor:pointer;transition:all .12s}
.layer-item:hover{background:var(--surf2)}
.layer-item.selected{background:var(--surf2);border-color:var(--border2)}
.layer-accent{width:3px;height:22px;border-radius:2px;flex-shrink:0}
.layer-name{flex:1;font-size:12px;color:var(--text);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer-btns{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.layer-item:hover .layer-btns,.layer-item.selected .layer-btns{opacity:1}
.lbtn{width:20px;height:20px;background:none;border:1px solid var(--border2);color:var(--muted);font-size:10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.lbtn:hover{background:var(--surf3);color:var(--text)}
.lbtn.del:hover{background:rgba(204,0,0,.15);border-color:#cc0000;color:#cc0000}

/* ── Canvas area ── */
.canvas-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.canvas-toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.canvas-toolbar .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.canvas-scroll{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:24px;background:repeating-linear-gradient(0deg,transparent,transparent 23px,var(--border) 23px,var(--border) 24px),repeating-linear-gradient(90deg,transparent,transparent 23px,var(--border) 23px,var(--border) 24px);background-size:24px 24px}

.screen{background:#f3f5f7;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5);overflow:hidden;transition:width .25s}
.screen.desktop{width:100%;max-width:720px}
.screen.phone{width:375px}
.screen-chrome{height:32px;background:#fff;border-bottom:1px solid #e7eaee;display:flex;align-items:center;gap:6px;padding:0 12px}
.chrome-dot{width:10px;height:10px;border-radius:50%}
.screen.phone .screen-chrome{display:none}
.phone-bar{height:40px;background:#fff;border-bottom:1px solid #e7eaee;display:none;align-items:center;justify-content:space-between;padding:0 16px}
.screen.phone .phone-bar{display:flex}
.phone-time{font-size:13px;font-weight:600;color:#111317}
.screen-body{min-height:120px}

.canvas-drop{padding:40px 20px;text-align:center;color:#848ea4;font-size:12px;line-height:1.6;display:none}
.canvas-drop.visible{display:block}

/* Canvas component wrapper */
.cv-comp{position:relative;cursor:pointer;outline:2px solid transparent;transition:outline-color .12s}
.cv-comp:hover{outline-color:rgba(85,129,241,.3)}
.cv-comp.selected{outline-color:#5581f1}
.cv-remove{position:absolute;top:6px;right:10px;width:20px;height:20px;background:rgba(17,19,23,.7);border-radius:4px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s;cursor:pointer;z-index:10}
.cv-comp:hover .cv-remove{opacity:1}

/* ── Prompt bar ── */
.prompt-bar{border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:12px;align-items:flex-start;flex-shrink:0;background:var(--surf)}
.prompt-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;white-space:nowrap}
.prompt-text{flex:1;font-size:12px;line-height:1.5;color:var(--text);font-style:italic}
.copy-btn{flex-shrink:0;background:var(--blue);border:none;color:#fff;font-family:var(--font);font-size:12px;font-weight:500;padding:7px 14px;border-radius:6px;cursor:pointer;transition:background .15s;white-space:nowrap}
.copy-btn:hover{background:var(--blue-h)}
.copy-btn.ok{background:#2e881b}

/* Seg control */
.seg{display:flex;background:var(--surf2);border-radius:6px;padding:2px;gap:2px}
.seg button{background:none;border:none;color:var(--muted);font-size:11px;font-family:var(--font);padding:4px 10px;border-radius:4px;cursor:pointer;transition:all .15s}
.seg button.active{background:var(--surf);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.seg button:hover:not(.active){color:var(--text)}
</style>
</head>
<body>

<div class="header">
  <h1>Screen Scratchpad</h1>
  <span class="sub">click components → arrange layers → copy prompt</span>
  <div class="header-right">
    <button class="hbtn" id="clear-btn">Clear all</button>
  </div>
</div>

<div class="body">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-tabs">
      <button class="stab active" data-tab="browse">Components</button>
      <button class="stab" data-tab="layers">Layers <span id="layer-count"></span></button>
    </div>

    <!-- Browse pane -->
    <div class="pane active" id="pane-browse">
      <div class="cat-filter" id="cat-filter"></div>
      <div class="comp-list" id="comp-list"></div>
    </div>

    <!-- Layers pane -->
    <div class="pane" id="pane-layers">
      <div class="layers-empty" id="layers-empty">No components yet.<br>Add some from the Components tab.</div>
      <div class="layer-list" id="layer-list"></div>
    </div>
  </aside>

  <!-- Canvas -->
  <div class="canvas-wrap">
    <div class="canvas-toolbar">
      <span class="label">View</span>
      <div class="seg" id="seg-view">
        <button data-val="desktop" class="active">Desktop</button>
        <button data-val="phone">Phone</button>
      </div>
      <span class="label" style="margin-left:12px">Background</span>
      <div class="seg" id="seg-bg">
        <button data-val="light" class="active">Light</button>
        <button data-val="dark">Dark</button>
      </div>
    </div>

    <div class="canvas-scroll">
      <div class="screen desktop" id="screen">
        <div class="screen-chrome">
          <div class="chrome-dot" style="background:#ff5f57"></div>
          <div class="chrome-dot" style="background:#ffbd2e"></div>
          <div class="chrome-dot" style="background:#28c840"></div>
        </div>
        <div class="phone-bar">
          <span class="phone-time">9:41</span>
          <svg width="60" height="14" viewBox="0 0 60 14" fill="none"><rect x="0" y="4" width="16" height="7" rx="2" fill="#111317"/><rect x="20" y="2" width="16" height="10" rx="2" fill="#111317"/><rect x="40" y="0" width="16" height="14" rx="2" fill="#111317"/></svg>
        </div>
        <div class="screen-body" id="screen-body">
          <div class="canvas-drop visible" id="canvas-drop">
            ↑ Click any component to add it here
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Prompt bar -->
<div class="prompt-bar">
  <span class="prompt-label">Prompt</span>
  <div class="prompt-text" id="prompt-text">Add components to generate a screen description prompt.</div>
  <button class="copy-btn" id="copy-btn">Copy Prompt</button>
</div>

// ── State ────────────────────────────────────────────────────────────────────

const state = {
  canvas: [],        // [{compId, instanceId}]
  selected: null,    // instanceId
  activeCat: 'all',
  activeTab: 'browse',
  view: 'desktop',
  bg: 'light',
  nextId: 1,
};

// ── Utility ──────────────────────────────────────────────────────────────────

function byId(id) { return document.getElementById(id); }
function getComp(id) { return CATALOG.find(c => c.id === id); }

// ── Add / remove / reorder ───────────────────────────────────────────────────

function addComp(compId) {
  const iid = state.nextId++;
  state.canvas.push({ compId, instanceId: iid });
  state.selected = iid;
  renderCanvas();
  renderLayers();
  updatePrompt();
  // Flash comp item in browser
  const el = document.querySelector(`[data-comp="${compId}"]`);
  if (el) { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 400); }
  // Scroll canvas to bottom
  setTimeout(() => {
    const s = document.querySelector('.canvas-scroll');
    s.scrollTop = s.scrollHeight;
  }, 50);
}

function removeComp(iid) {
  state.canvas = state.canvas.filter(c => c.instanceId !== iid);
  if (state.selected === iid) state.selected = state.canvas.length ? state.canvas[state.canvas.length-1].instanceId : null;
  renderCanvas();
  renderLayers();
  updatePrompt();
}

function moveComp(iid, dir) {
  const idx = state.canvas.findIndex(c => c.instanceId === iid);
  const target = idx + dir;
  if (target < 0 || target >= state.canvas.length) return;
  [state.canvas[idx], state.canvas[target]] = [state.canvas[target], state.canvas[idx]];
  renderCanvas();
  renderLayers();
  updatePrompt();
}

function selectComp(iid) {
  state.selected = iid;
  renderCanvas();
  renderLayers();
}

// ── Render canvas ─────────────────────────────────────────────────────────────

function renderCanvas() {
  const body = byId('screen-body');
  const drop = byId('canvas-drop');
  const screen = byId('screen');

  // Dark mode background
  const pageBg = state.bg === 'dark' ? '#1c1f26' : '#f3f5f7';
  screen.style.background = pageBg;

  // View mode
  screen.className = `screen ${state.view}`;

  if (state.canvas.length === 0) {
    body.innerHTML = '';
    body.appendChild(drop);
    drop.classList.add('visible');
    return;
  }
  drop.classList.remove('visible');

  body.innerHTML = state.canvas.map(({ compId, instanceId }) => {
    const comp = getComp(compId);
    return `<div class="cv-comp${state.selected === instanceId ? ' selected' : ''}" data-iid="${instanceId}">
      ${comp.html}
      <div class="cv-remove" data-iid="${instanceId}" title="Remove">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg>
      </div>
    </div>`;
  }).join('');

  body.appendChild(drop);

  // Events
  body.querySelectorAll('.cv-comp').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.cv-remove')) return;
      selectComp(parseInt(el.dataset.iid));
    });
  });
  body.querySelectorAll('.cv-remove').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      removeComp(parseInt(el.dataset.iid));
    });
  });
}

// ── Render layers ─────────────────────────────────────────────────────────────

function renderLayers() {
  const list = byId('layer-list');
  const empty = byId('layers-empty');
  const count = byId('layer-count');

  const n = state.canvas.length;
  count.textContent = n ? `(${n})` : '';
  empty.style.display = n ? 'none' : 'block';
  list.style.display = n ? 'flex' : 'none';

  if (!n) { list.innerHTML = ''; return; }

  list.innerHTML = state.canvas.map(({ compId, instanceId }, idx) => {
    const comp = getComp(compId);
    const cat = CATS[comp.cat];
    return `<div class="layer-item${state.selected === instanceId ? ' selected' : ''}" data-iid="${instanceId}">
      <div class="layer-accent" style="background:${cat.color}"></div>
      <span class="layer-name">${comp.label}</span>
      <div class="layer-btns">
        <button class="lbtn" data-iid="${instanceId}" data-dir="-1" title="Move up" ${idx===0?'disabled':''}>↑</button>
        <button class="lbtn" data-iid="${instanceId}" data-dir="1" title="Move down" ${idx===state.canvas.length-1?'disabled':''}>↓</button>
        <button class="lbtn del" data-iid="${instanceId}" title="Remove">×</button>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.layer-item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.layer-btns')) return;
      const iid = parseInt(el.dataset.iid);
      selectComp(iid);
      // Scroll canvas component into view
      const cvEl = document.querySelector(`.cv-comp[data-iid="${iid}"]`);
      if (cvEl) cvEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
    });
  });
  list.querySelectorAll('.lbtn[data-dir]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      moveComp(parseInt(btn.dataset.iid), parseInt(btn.dataset.dir));
    });
  });
  list.querySelectorAll('.lbtn.del').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      removeComp(parseInt(btn.dataset.iid));
    });
  });
}

// ── Render component browser ──────────────────────────────────────────────────

function renderBrowser() {
  const list = byId('comp-list');
  const filtered = state.activeCat === 'all'
    ? CATALOG
    : CATALOG.filter(c => c.cat === state.activeCat);

  list.innerHTML = filtered.map(comp => {
    const cat = CATS[comp.cat];
    return `<div class="comp-item" data-comp="${comp.id}">
      <div class="comp-icon" style="background:${cat.color}22">${cat.emoji}</div>
      <div class="comp-meta">
        <div class="comp-name">${comp.label}</div>
        <div class="comp-cat">${cat.label}</div>
      </div>
      <div class="comp-add">
        <svg width="10" height="10" viewBox="0 0 10 10"><line x1="5" y1="1" x2="5" y2="9" stroke="white" stroke-width="1.4" stroke-linecap="round"/><line x1="1" y1="5" x2="9" y2="5" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.comp-item').forEach(el => {
    el.addEventListener('click', () => addComp(el.dataset.comp));
  });
}

function renderCatFilter() {
  const filter = byId('cat-filter');
  const cats = [['all','All'], ...Object.entries(CATS).map(([k,v]) => [k, v.label])];
  filter.innerHTML = cats.map(([k, label]) =>
    `<button class="cat-btn${state.activeCat === k ? ' active' : ''}" data-cat="${k}">${label}</button>`
  ).join('');
  filter.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeCat = btn.dataset.cat;
      renderCatFilter();
      renderBrowser();
    });
  });
}

// ── Prompt ────────────────────────────────────────────────────────────────────

function updatePrompt() {
  const el = byId('prompt-text');
  if (state.canvas.length === 0) {
    el.textContent = 'Add components to generate a screen description prompt.';
    return;
  }

  const comps = state.canvas.map(({ compId }) => getComp(compId));
  const numbered = comps.map((c, i) => `${i + 1}) ${c.desc} (${c.file || 'layout element'})`);

  const viewDesc = state.view === 'phone' ? 'a 375px mobile screen' : 'a full-width desktop page';
  const bgDesc = state.bg === 'dark' ? 'dark (#1c1f26) page background' : 'light (#f3f5f7) page background';

  el.textContent = `Build ${viewDesc} with a ${bgDesc}. Assemble the following sections from top to bottom: ${numbered.join('; ')}.`;
}

// ── Segments and toolbar ──────────────────────────────────────────────────────

function setupSeg(id, stateKey, onChange) {
  byId(id).querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      byId(id).querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state[stateKey] = btn.dataset.val;
      onChange();
    });
  });
}

setupSeg('seg-view', 'view', () => { renderCanvas(); updatePrompt(); });
setupSeg('seg-bg',   'bg',   () => { renderCanvas(); updatePrompt(); });

// ── Sidebar tabs ──────────────────────────────────────────────────────────────

document.querySelectorAll('.stab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.stab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    byId(`pane-${btn.dataset.tab}`).classList.add('active');
    state.activeTab = btn.dataset.tab;
  });
});

// ── Clear ─────────────────────────────────────────────────────────────────────

byId('clear-btn').addEventListener('click', () => {
  if (state.canvas.length === 0) return;
  if (!confirm('Clear all components from the canvas?')) return;
  state.canvas = [];
  state.selected = null;
  renderCanvas();
  renderLayers();
  updatePrompt();
});

// ── Copy ──────────────────────────────────────────────────────────────────────

byId('copy-btn').addEventListener('click', function() {
  const text = byId('prompt-text').textContent;
  if (text.startsWith('Add components')) return;
  navigator.clipboard.writeText(text).then(() => {
    this.textContent = 'Copied!';
    this.classList.add('ok');
    setTimeout(() => { this.textContent = 'Copy Prompt'; this.classList.remove('ok'); }, 1800);
  });
});

// ── Presets ───────────────────────────────────────────────────────────────────

// Load a preset on start so canvas isn't blank
function loadPreset() {
  ['app-header', 'tab-group', 'filter-bar', 'stat-cards', 'table', 'alert-info'].forEach(id => {
    state.canvas.push({ compId: id, instanceId: state.nextId++ });
  });
  state.selected = state.canvas[0].instanceId;
  renderCanvas();
  renderLayers();
  updatePrompt();
}

// ── Init ──────────────────────────────────────────────────────────────────────

renderCatFilter();
renderBrowser();
loadPreset();
</script>
