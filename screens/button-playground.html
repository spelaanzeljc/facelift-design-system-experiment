<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Button Explorer — Design System</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  font-family:system-ui,-apple-system,sans-serif;
  background:#16181c;color:#e4e6ea;
  display:grid;grid-template-rows:auto 1fr auto;
  min-height:100vh;font-size:13px;
}

/* top bar */
.topbar{
  display:flex;align-items:center;gap:8px;
  padding:9px 16px;border-bottom:1px solid #2a2d34;background:#1c1f26;
  flex-wrap:wrap;
}
.topbar-title{font-size:13px;font-weight:600;color:#fff;margin-right:4px;flex-shrink:0}
.preset-pill{
  padding:4px 10px;border-radius:20px;border:1px solid #2e3138;
  background:#21242c;color:#a0a8b8;font-size:11px;cursor:pointer;
  transition:all .12s;white-space:nowrap;
}
.preset-pill:hover{border-color:#4a4f5c;color:#e4e6ea}
.preset-pill.active{background:#1339EC;border-color:#1339EC;color:#fff}
.bg-toggle{
  display:flex;gap:3px;padding:3px;background:#21242c;border-radius:6px;border:1px solid #2e3138;
  margin-left:auto;flex-shrink:0;
}
.bg-toggle button{
  padding:3px 8px;border-radius:4px;border:none;background:none;
  font-size:10px;cursor:pointer;color:#606878;transition:all .12s;
}
.bg-toggle button.active{background:#2e3138;color:#e4e6ea}

/* main layout */
.main{display:grid;grid-template-columns:236px 1fr;overflow:hidden}

/* sidebar */
.sidebar{
  border-right:1px solid #2a2d34;background:#1c1f26;
  overflow-y:auto;padding:14px 12px;
  display:flex;flex-direction:column;gap:18px;
}
.ctrl-label{
  font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:#606878;margin-bottom:7px;
}
.pill-row{display:flex;flex-wrap:wrap;gap:4px}
.pill{
  padding:5px 10px;border-radius:6px;border:1px solid #2e3138;
  background:#21242c;color:#a0a8b8;font-size:12px;cursor:pointer;
  transition:all .12s;user-select:none;
}
.pill:hover{border-color:#4a4f5c;color:#e4e6ea}
.pill.active{background:#1339EC;border-color:#1339EC;color:#fff}

.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.type-card{
  padding:8px 9px;border-radius:7px;border:1px solid #2e3138;
  background:#21242c;cursor:pointer;transition:all .12s;
}
.type-card:hover{border-color:#4a4f5c}
.type-card.active{border-color:#1339EC;background:#0d1a4a}
.type-card-label{font-size:11px;font-weight:500;color:#a0a8b8;display:block;margin-bottom:4px}
.type-card.active .type-card-label{color:#7fa8ff}
.type-mini{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:4px;font-size:10px;font-weight:600}

.text-input{
  width:100%;background:#21242c;border:1px solid #2e3138;border-radius:6px;
  color:#e4e6ea;font-size:12px;padding:6px 9px;font-family:inherit;
  transition:border-color .12s;
}
.text-input:focus{outline:none;border-color:#1339EC}

.toggle-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:2px 0}
.toggle-row span{font-size:12px;color:#a0a8b8}
.toggle{
  width:28px;height:15px;border-radius:8px;background:#2e3138;
  position:relative;transition:background .15s;cursor:pointer;flex-shrink:0;
}
.toggle.on{background:#1339EC}
.toggle::after{
  content:'';position:absolute;top:1.5px;left:1.5px;
  width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .15s;
}
.toggle.on::after{transform:translateX(13px)}

/* ── icon picker ── */
.icon-slot-tabs{display:flex;gap:3px;margin-bottom:7px}
.icon-slot-tab{
  flex:1;padding:5px 6px;border-radius:6px;border:1px solid #2e3138;
  background:#21242c;color:#606878;font-size:11px;font-weight:600;
  cursor:pointer;text-align:center;transition:all .12s;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.icon-slot-tab:hover{border-color:#4a4f5c;color:#a0a8b8}
.icon-slot-tab.active{border-color:#1339EC;background:#0d1a4a;color:#7fa8ff}
.icon-slot-preview{
  width:14px;height:14px;display:flex;align-items:center;justify-content:center;
  border-radius:3px;flex-shrink:0;
}
.icon-slot-preview img{width:12px;height:12px;display:block;filter:invert(.5)}
.icon-slot-tab.active .icon-slot-preview img{filter:invert(.8)}
.slot-none-indicator{
  font-size:10px;color:#3a404e;font-weight:400;
}

.icon-search-wrap{position:relative;margin-bottom:6px}
.icon-search-wrap svg{position:absolute;left:7px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.4}
.icon-search{
  width:100%;background:#21242c;border:1px solid #2e3138;border-radius:6px;
  color:#e4e6ea;font-size:12px;padding:5px 8px 5px 26px;font-family:inherit;
  transition:border-color .12s;
}
.icon-search:focus{outline:none;border-color:#1339EC}

.icon-grid-wrap{
  height:176px;overflow-y:auto;border-radius:6px;
  border:1px solid #2e3138;background:#1a1d24;
}
.icon-grid-wrap::-webkit-scrollbar{width:4px}
.icon-grid-wrap::-webkit-scrollbar-track{background:transparent}
.icon-grid-wrap::-webkit-scrollbar-thumb{background:#2e3138;border-radius:2px}

.icon-grid{display:grid;grid-template-columns:repeat(6,1fr)}
.icon-cell{
  display:flex;align-items:center;justify-content:center;
  width:100%;aspect-ratio:1;cursor:pointer;
  transition:background .1s;
}
.icon-cell:hover{background:#2a2d34}
.icon-cell.selected{background:#0d1a4a;outline:1px solid #1339EC;outline-offset:-1px}
.icon-cell img{width:15px;height:15px;display:block;filter:invert(.65)}
.icon-cell.selected img{filter:invert(1)}
.icon-cell-none{
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:#3a404e;cursor:pointer;
  transition:all .1s;width:100%;aspect-ratio:1;
  border-right:1px solid #2a2d34;border-bottom:1px solid #2a2d34;
}
.icon-cell-none:hover{color:#a0a8b8;background:#2a2d34}
.icon-cell-none.selected{color:#7fa8ff;background:#0d1a4a;outline:1px solid #1339EC;outline-offset:-1px}
.icon-count{font-size:10px;color:#3a404e;margin-top:3px;text-align:right}

/* right panel */
.right{display:flex;flex-direction:column;overflow:hidden}
.preview-area{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:32px;
  background:#1a1d24;padding:32px;overflow-y:auto;
}
.preview-label{
  font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:#606878;
  margin-bottom:10px;text-align:center;
}
.preview-main{display:flex;flex-direction:column;align-items:center;gap:8px}

/* ── component button styles (exact Figma values) ── */
.ds-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:8px;border:none;cursor:pointer;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:500;line-height:1;white-space:nowrap;
  transition:background .12s,opacity .12s,color .12s,box-shadow .12s;
  position:relative;
}
.ds-btn.sz-small{height:32px;padding:0 12px;font-size:12px;gap:5px}
.ds-btn.sz-medium{height:36px;padding:0 16px;font-size:14px}
.ds-btn.sz-large{height:40px;padding:0 20px;font-size:16px;gap:8px}

/* primary */
.ds-btn.tp-primary{background:#1339EC;color:#fff;border:none;--icon-filter:brightness(0) invert(1)}
.ds-btn.tp-primary.st-hover{background:#0F2EBD}
.ds-btn.tp-primary.st-pressed,.ds-btn.tp-primary.st-active{background:#0c228d}
.ds-btn.tp-primary.st-focused{background:#1339EC;box-shadow:0 0 0 3px rgba(83,129,241,.5)}
.ds-btn.tp-primary.st-disabled{opacity:.38;cursor:not-allowed}
.ds-btn.tp-primary.st-loading{background:#0F2EBD;cursor:wait}
/* secondary */
.ds-btn.tp-secondary{background:#fff;color:#111317;border:1px solid #111317;--icon-filter:brightness(0)}
.ds-btn.tp-secondary.st-hover{background:rgba(95,106,130,.08)}
.ds-btn.tp-secondary.st-pressed,.ds-btn.tp-secondary.st-active{background:rgba(95,106,130,.15)}
.ds-btn.tp-secondary.st-focused{background:#fff;box-shadow:0 0 0 3px rgba(83,129,241,.4)}
.ds-btn.tp-secondary.st-disabled{opacity:.38;cursor:not-allowed}
.ds-btn.tp-secondary.st-loading{background:rgba(95,106,130,.08);cursor:wait}
/* ghost */
.ds-btn.tp-ghost{background:transparent;color:#1339EC;border:none;
  --icon-filter:invert(19%) sepia(96%) saturate(4000%) hue-rotate(228deg) brightness(92%)}
.ds-btn.tp-ghost.st-hover{background:#eef3fd}
.ds-btn.tp-ghost.st-pressed,.ds-btn.tp-ghost.st-active{background:#dfe7fd}
.ds-btn.tp-ghost.st-focused{box-shadow:0 0 0 3px rgba(83,129,241,.4)}
.ds-btn.tp-ghost.st-disabled{opacity:.38;cursor:not-allowed}
.ds-btn.tp-ghost.st-loading{background:#eef3fd;cursor:wait}
/* destructive */
.ds-btn.tp-destructive{background:#ffebeb;color:#cc0000;border:none;
  --icon-filter:invert(13%) sepia(100%) saturate(7500%) hue-rotate(0deg) brightness(95%) contrast(105%)}
.ds-btn.tp-destructive.st-hover{background:#ffd1d1;color:#b20000}
.ds-btn.tp-destructive.st-pressed,.ds-btn.tp-destructive.st-active{background:#ffb3b3;color:#990000}
.ds-btn.tp-destructive.st-focused{background:#ffebeb;box-shadow:0 0 0 3px rgba(204,0,0,.25)}
.ds-btn.tp-destructive.st-disabled{opacity:.38;cursor:not-allowed}
.ds-btn.tp-destructive.st-loading{background:#ffd1d1;cursor:wait}

.ds-btn.shape-round{border-radius:100px}
.ds-btn.icon-only.sz-small{width:32px;padding:0}
.ds-btn.icon-only.sz-medium{width:36px;padding:0}
.ds-btn.icon-only.sz-large{width:40px;padding:0}

.btn-icon{display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-icon img{display:block;filter:var(--icon-filter,brightness(0))}
.sz-small .btn-icon img,.sz-small .btn-icon svg{width:12px;height:12px}
.sz-medium .btn-icon img,.sz-medium .btn-icon svg{width:14px;height:14px}
.sz-large .btn-icon img,.sz-large .btn-icon svg{width:16px;height:16px}

.ds-btn .spinner{
  width:14px;height:14px;border-radius:50%;
  border:2px solid currentColor;border-top-color:transparent;
  animation:spin .6s linear infinite;flex-shrink:0;
}
.ds-btn.sz-small .spinner{width:11px;height:11px}
.ds-btn.sz-large .spinner{width:16px;height:16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* state matrix */
.matrix{width:100%;display:flex;flex-direction:column}
.matrix-row{display:flex;align-items:center;gap:16px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.matrix-row:first-child{border-top:none}
.matrix-state{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#606878;width:60px;flex-shrink:0;text-align:right}

/* prompt */
.prompt-bar{border-top:1px solid #2a2d34;background:#1c1f26;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.prompt-text{flex:1;font-family:ui-monospace,monospace;font-size:11px;line-height:1.55;color:#a0a8b8;background:#21242c;border:1px solid #2e3138;border-radius:6px;padding:7px 9px;min-height:44px}
.copy-btn{padding:7px 14px;border-radius:6px;background:#1339EC;border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:background .12s;flex-shrink:0;align-self:stretch}
.copy-btn:hover{background:#0F2EBD}
.copy-btn.copied{background:#2e881b}
.filename-chip{font-family:ui-monospace,monospace;font-size:10px;background:#21242c;border:1px solid #2e3138;border-radius:4px;padding:3px 7px;color:#606878;margin-top:6px;word-break:break-all;text-align:center;max-width:480px}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">Button Explorer</span>
  <button class="preset-pill" onclick="applyPreset('cta')">Primary CTA</button>
  <button class="preset-pill" onclick="applyPreset('secondary')">Secondary</button>
  <button class="preset-pill" onclick="applyPreset('ghost')">Ghost</button>
  <button class="preset-pill" onclick="applyPreset('danger')">Destructive</button>
  <button class="preset-pill" onclick="applyPreset('icon')">Icon Only</button>
  <div class="bg-toggle">
    <button id="bg-dark" class="active" onclick="setBg('dark')">Dark</button>
    <button id="bg-neutral" onclick="setBg('neutral')">Neutral</button>
    <button id="bg-light" onclick="setBg('light')">Light</button>
  </div>
</div>

<div class="main">
  <div class="sidebar">

    <!-- Type -->
    <div>
      <div class="ctrl-label">Type</div>
      <div class="type-grid" id="type-grid">
        <div class="type-card active" data-type="primary" onclick="set('type','primary')">
          <span class="type-card-label">Primary</span>
          <span class="type-mini" style="background:#1339EC;color:#fff">Action</span>
        </div>
        <div class="type-card" data-type="secondary" onclick="set('type','secondary')">
          <span class="type-card-label">Secondary</span>
          <span class="type-mini" style="background:#fff;color:#111317;border:1px solid #111317">Action</span>
        </div>
        <div class="type-card" data-type="ghost" onclick="set('type','ghost')">
          <span class="type-card-label">Ghost</span>
          <span class="type-mini" style="background:transparent;color:#1339EC">Action</span>
        </div>
        <div class="type-card" data-type="destructive" onclick="set('type','destructive')">
          <span class="type-card-label">Destructive</span>
          <span class="type-mini" style="background:#ffebeb;color:#cc0000">Delete</span>
        </div>
      </div>
    </div>

    <!-- Size -->
    <div>
      <div class="ctrl-label">Size</div>
      <div class="pill-row" id="size-pills">
        <div class="pill" data-size="small" onclick="set('size','small')">S — 32px</div>
        <div class="pill active" data-size="medium" onclick="set('size','medium')">M — 36px</div>
        <div class="pill" data-size="large" onclick="set('size','large')">L — 40px</div>
      </div>
    </div>

    <!-- State -->
    <div>
      <div class="ctrl-label">State</div>
      <div class="pill-row" id="state-pills">
        <div class="pill active" data-state="default" onclick="set('state','default')">Default</div>
        <div class="pill" data-state="hover" onclick="set('state','hover')">Hover</div>
        <div class="pill" data-state="focused" onclick="set('state','focused')">Focused</div>
        <div class="pill" data-state="pressed" onclick="set('state','pressed')">Pressed</div>
        <div class="pill" data-state="disabled" onclick="set('state','disabled')">Disabled</div>
        <div class="pill" data-state="loading" onclick="set('state','loading')">Loading ✦</div>
      </div>
      <div style="font-size:10px;color:#3a404e;margin-top:4px;line-height:1.4">✦ CSS-only — no Figma variant</div>
    </div>

    <!-- Label -->
    <div>
      <div class="ctrl-label">Label</div>
      <input class="text-input" type="text" id="label-input" value="Button text" oninput="updateAll()">
    </div>

    <!-- Options -->
    <div>
      <div class="ctrl-label">Options</div>
      <div style="display:flex;flex-direction:column;gap:7px">
        <div class="toggle-row" onclick="toggle('iconOnly')">
          <span>Icon only</span>
          <div class="toggle" id="toggle-iconOnly"></div>
        </div>
        <div class="toggle-row" onclick="toggle('roundShape')">
          <span>Round shape</span>
          <div class="toggle" id="toggle-roundShape"></div>
        </div>
      </div>
    </div>

    <!-- Icon picker — shared for leading + trailing -->
    <div>
      <div class="ctrl-label">Icons</div>

      <!-- slot tabs -->
      <div class="icon-slot-tabs">
        <div class="icon-slot-tab active" id="tab-leading" onclick="setActiveSlot('leading')">
          <div class="icon-slot-preview" id="preview-leading">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
              <path d="M2 5h6M5 2l3 3-3 3" stroke="#606878" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          Leading
        </div>
        <div class="icon-slot-tab" id="tab-trailing" onclick="setActiveSlot('trailing')">
          Trailing
          <div class="icon-slot-preview" id="preview-trailing">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
              <path d="M2 5h6M5 2l3 3-3 3" stroke="#606878" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- search -->
      <div class="icon-search-wrap">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <circle cx="5.2" cy="5.2" r="3.5" stroke="#a0a8b8" stroke-width="1.2"/>
          <line x1="7.8" y1="7.8" x2="10.5" y2="10.5" stroke="#a0a8b8" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <input class="icon-search" type="text" id="icon-search" placeholder="Search 433 icons…" oninput="renderIconGrid()">
      </div>

      <!-- grid -->
      <div class="icon-grid-wrap">
        <div class="icon-grid" id="icon-grid"></div>
      </div>
      <div class="icon-count" id="icon-count"></div>
    </div>

  </div><!-- /sidebar -->

  <div class="right">
    <div class="preview-area" id="preview-area">

      <div class="preview-main">
        <div class="preview-label">Preview</div>
        <div id="preview-btn-wrap"></div>
        <div class="filename-chip" id="filename-chip">…</div>
      </div>

      <div style="width:100%;max-width:560px">
        <div class="preview-label">All states — <span id="matrix-desc"></span></div>
        <div class="matrix" id="matrix"></div>
      </div>

    </div>
  </div>
</div>

<div class="prompt-bar">
  <div class="prompt-text" id="prompt-text">…</div>
  <button class="copy-btn" id="copy-btn" onclick="copyPrompt()">Copy</button>
</div>

<script>

/* ── state ── */
const DEFAULTS = {
  type:'primary', size:'medium', state:'default',
  label:'Button text',
  iconOnly:false, roundShape:false,
  leadingIcon: null,  // icon name or null
  trailingIcon: null, // icon name or null
};
const state = { ...DEFAULTS };

let activeSlot = 'leading'; // which slot the picker is editing

/* ── SVG cache ── */
const iconCache = {};

async function loadIconSvg(name) {
  if (iconCache[name]) return iconCache[name];
  try {
    const res = await fetch(`../output/icons/${name}.svg`);
    if (!res.ok) throw new Error();
    let txt = await res.text();
    txt = txt.replace(/fill="(?!none)[^"]*"/g, 'fill="currentColor"');
    txt = txt.replace(/stroke="(?!none)[^"]*"/g, 'stroke="currentColor"');
    iconCache[name] = { type:'svg', content:txt };
  } catch {
    iconCache[name] = { type:'img', name };
  }
  return iconCache[name];
}

/* ── icon html for button slot ── */
function iconHtml(name, px) {
  if (!name) return null;
  const cached = iconCache[name];
  if (!cached) {
    // not yet loaded — use img immediately (will update once fetched)
    return `<img src="../output/icons/${name}.svg" width="${px}" height="${px}">`;
  }
  if (cached.type === 'svg') {
    return cached.content
      .replace(/<svg([^>]*)width="[^"]*"/, `<svg$1width="${px}"`)
      .replace(/height="[^"]*"/, `height="${px}"`);
  }
  return `<img src="../output/icons/${name}.svg" width="${px}" height="${px}">`;
}

/* ── build button element ── */
function makeBtn(type, size, stateKey, label, iconOnly, roundShape, leadingIcon, trailingIcon) {
  const px = size === 'small' ? 12 : size === 'large' ? 16 : 14;

  const btn = document.createElement('button');
  btn.className = ['ds-btn',`tp-${type}`,`sz-${size}`,`st-${stateKey}`,
    roundShape ? 'shape-round':'', iconOnly ? 'icon-only':''].filter(Boolean).join(' ');
  if (stateKey === 'disabled') btn.disabled = true;

  if (stateKey === 'loading') {
    const sp = document.createElement('span'); sp.className = 'spinner';
    if (!iconOnly) {
      btn.appendChild(sp);
      const t = document.createElement('span'); t.textContent = label; btn.appendChild(t);
    } else {
      btn.appendChild(sp);
    }
    return btn;
  }

  if (iconOnly) {
    const icon = leadingIcon || trailingIcon; // show whichever is set
    const wrap = document.createElement('span'); wrap.className = 'btn-icon';
    const html = iconHtml(icon, px);
    if (html) wrap.innerHTML = html;
    else wrap.innerHTML = `<svg width="${px}" height="${px}" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>`;
    btn.appendChild(wrap);
    return btn;
  }

  if (leadingIcon) {
    const wrap = document.createElement('span'); wrap.className = 'btn-icon';
    wrap.innerHTML = iconHtml(leadingIcon, px);
    btn.appendChild(wrap);
  }
  const txt = document.createElement('span'); txt.textContent = label;
  btn.appendChild(txt);
  if (trailingIcon) {
    const wrap = document.createElement('span'); wrap.className = 'btn-icon';
    wrap.innerHTML = iconHtml(trailingIcon, px);
    btn.appendChild(wrap);
  }
  return btn;
}

/* ── render preview ── */
function renderPreview() {
  const wrap = document.getElementById('preview-btn-wrap');
  wrap.innerHTML = '';
  wrap.appendChild(makeBtn(state.type, state.size, state.state, state.label,
    state.iconOnly, state.roundShape, state.leadingIcon, state.trailingIcon));
  document.getElementById('filename-chip').textContent = buildFilename();
}

/* ── state matrix ── */
const MATRIX_STATES = ['default','hover','focused','pressed','disabled','loading'];
function renderMatrix() {
  const matrix = document.getElementById('matrix');
  matrix.innerHTML = '';
  MATRIX_STATES.forEach(s => {
    const row = document.createElement('div'); row.className = 'matrix-row';
    const lbl = document.createElement('div'); lbl.className = 'matrix-state'; lbl.textContent = s;
    row.appendChild(lbl);
    const btn = makeBtn(state.type, state.size, s, state.label,
      state.iconOnly, state.roundShape, state.leadingIcon, state.trailingIcon);
    btn.style.pointerEvents = 'none';
    row.appendChild(btn);
    matrix.appendChild(row);
  });
  const desc = {primary:'Primary bold',secondary:'Secondary bold',ghost:'Ghost (minimal)',destructive:'Destructive bold'};
  const sz   = {small:'S 32px',medium:'M 36px',large:'L 40px'};
  document.getElementById('matrix-desc').textContent = `${desc[state.type]}, ${sz[state.size]}`;
}

/* ── icon picker ── */
function setActiveSlot(slot) {
  activeSlot = slot;
  document.getElementById('tab-leading').classList.toggle('active', slot === 'leading');
  document.getElementById('tab-trailing').classList.toggle('active', slot === 'trailing');
  // clear search when switching slots
  document.getElementById('icon-search').value = '';
  renderIconGrid();
}

function renderIconGrid() {
  const q = (document.getElementById('icon-search').value || '').toLowerCase();
  const filtered = q ? ICONS.filter(n => n.includes(q)) : ICONS;
  const current = activeSlot === 'leading' ? state.leadingIcon : state.trailingIcon;
  const grid = document.getElementById('icon-grid');

  let html = `<div class="icon-cell-none ${current === null ? 'selected' : ''}" onclick="selectIcon(null)" title="No icon">✕</div>`;
  filtered.slice(0, 300).forEach(name => {
    html += `<div class="icon-cell ${current === name ? 'selected' : ''}" onclick="selectIcon('${name}')" title="${name}">
      <img src="../output/icons/${name}.svg" alt="${name}">
    </div>`;
  });

  grid.innerHTML = html;
  document.getElementById('icon-count').textContent =
    filtered.length > 300
      ? `Showing 300 of ${filtered.length} — refine search`
      : q ? `${filtered.length} match${filtered.length !== 1 ? 'es' : ''}` : `${ICONS.length} icons`;

  updateSlotPreviews();
}

function updateSlotPreviews() {
  // leading tab preview
  const lp = document.getElementById('preview-leading');
  if (state.leadingIcon) {
    lp.innerHTML = `<img src="../output/icons/${state.leadingIcon}.svg" style="width:12px;height:12px;filter:invert(.5)">`;
  } else {
    lp.innerHTML = `<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1 5h4M3 3l2 2-2 2" stroke="#3a404e" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  // trailing tab preview
  const tp = document.getElementById('preview-trailing');
  if (state.trailingIcon) {
    tp.innerHTML = `<img src="../output/icons/${state.trailingIcon}.svg" style="width:12px;height:12px;filter:invert(.5)">`;
  } else {
    tp.innerHTML = `<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 5h4M7 3l2 2-2 2" stroke="#3a404e" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
}

async function selectIcon(name) {
  if (activeSlot === 'leading') state.leadingIcon = name;
  else state.trailingIcon = name;

  if (name && !iconCache[name]) {
    await loadIconSvg(name);
  }
  renderIconGrid();
  updateAll();
}

/* ── Figma filename ── */
const TYPE_MAP = {
  primary:     {family:'primary',   emphasis:'bold'},
  secondary:   {family:'secondary', emphasis:'bold'},
  ghost:       {family:'primary',   emphasis:'minimal'},
  destructive: {family:'danger',    emphasis:'bold'},
};
const STATE_FIGMA = {default:'default',hover:'hover',focused:'focused',pressed:'pressed',disabled:'disabled',loading:null};

function buildFilename() {
  const {family,emphasis} = TYPE_MAP[state.type];
  const fs = STATE_FIGMA[state.state];
  if (!fs) return '(loading — CSS only, no Figma variant)';
  const io  = state.iconOnly ? 'true' : 'false';
  const shp = state.roundShape ? 'round' : 'rectangle';
  return `output/components/action_${family}_-size_${state.size}_-emphasis_${emphasis}_-state_${fs}_-icon-only_${io}_-shape_${shp}.html`;
}

/* ── prompt ── */
function updatePrompt() {
  const typeL  = {primary:'primary',secondary:'secondary',ghost:'ghost',destructive:'destructive'};
  const sizeL  = {small:'small (S, 32px)',medium:'medium (M, 36px)',large:'large (L, 40px)'};
  const stateL = {default:'',hover:'hovered',focused:'focused',pressed:'pressed',disabled:'disabled',loading:'loading'};

  let text = `Use a ${typeL[state.type]} action button`;
  const extras = [];
  if (state.size !== DEFAULTS.size) extras.push(`size ${sizeL[state.size]}`);
  if (state.state !== DEFAULTS.state && stateL[state.state]) extras.push(`${stateL[state.state]} state`);
  if (state.leadingIcon) extras.push(`leading icon "${state.leadingIcon}" (output/icons/${state.leadingIcon}.svg)`);
  if (state.trailingIcon) extras.push(`trailing icon "${state.trailingIcon}" (output/icons/${state.trailingIcon}.svg)`);
  if (state.iconOnly) extras.push('icon-only (no label)');
  else if (state.label !== DEFAULTS.label) extras.push(`label "${state.label}"`);
  if (state.roundShape) extras.push('round/pill shape');
  if (extras.length) text += ` — ${extras.join(', ')}`;
  text += `. Figma file: ${buildFilename()}`;

  document.getElementById('prompt-text').textContent = text;
}

/* ── background ── */
function setBg(mode) {
  const colors = {dark:'#1a1d24',neutral:'#f3f5f7',light:'#ffffff'};
  document.getElementById('preview-area').style.background = colors[mode];
  ['dark','neutral','light'].forEach(m =>
    document.getElementById(`bg-${m}`).classList.toggle('active', m === mode));
}

/* ── controls ── */
function set(key, val) {
  state[key] = val;
  if (key==='type')  document.querySelectorAll('#type-grid .type-card').forEach(el=>el.classList.toggle('active',el.dataset.type===val));
  if (key==='size')  document.querySelectorAll('#size-pills .pill').forEach(el=>el.classList.toggle('active',el.dataset.size===val));
  if (key==='state') document.querySelectorAll('#state-pills .pill').forEach(el=>el.classList.toggle('active',el.dataset.state===val));
  updateAll();
}
function toggle(key) {
  state[key] = !state[key];
  document.getElementById(`toggle-${key}`)?.classList.toggle('on', state[key]);
  updateAll();
}

/* ── presets ── */
const PRESETS = {
  cta:       {type:'primary',     size:'medium', state:'default', label:'Get started',    iconOnly:false, roundShape:false, leadingIcon:null,          trailingIcon:'arrow-right'},
  secondary: {type:'secondary',   size:'medium', state:'default', label:'Cancel',          iconOnly:false, roundShape:false, leadingIcon:null,          trailingIcon:null},
  ghost:     {type:'ghost',       size:'medium', state:'default', label:'Learn more',      iconOnly:false, roundShape:false, leadingIcon:null,          trailingIcon:'chevron-right-small'},
  danger:    {type:'destructive', size:'medium', state:'default', label:'Delete campaign', iconOnly:false, roundShape:false, leadingIcon:'garbage-can', trailingIcon:null},
  icon:      {type:'primary',     size:'medium', state:'default', label:'',                iconOnly:true,  roundShape:true,  leadingIcon:'plus-sign-small', trailingIcon:null},
};

async function applyPreset(key) {
  Object.assign(state, PRESETS[key]);
  document.getElementById('label-input').value = state.label;
  ['iconOnly','roundShape'].forEach(k =>
    document.getElementById(`toggle-${k}`)?.classList.toggle('on', state[k]));
  document.querySelectorAll('#type-grid .type-card').forEach(el=>el.classList.toggle('active',el.dataset.type===state.type));
  document.querySelectorAll('#size-pills .pill').forEach(el=>el.classList.toggle('active',el.dataset.size===state.size));
  document.querySelectorAll('#state-pills .pill').forEach(el=>el.classList.toggle('active',el.dataset.state===state.state));
  // pre-cache preset icons
  const toLoad = [state.leadingIcon, state.trailingIcon].filter(Boolean);
  await Promise.all(toLoad.map(n => iconCache[n] ? null : loadIconSvg(n)));
  renderIconGrid();
  updateAll();
}

/* ── copy ── */
function copyPrompt() {
  navigator.clipboard.writeText(document.getElementById('prompt-text').textContent).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied')},1500);
  });
}

/* ── update all ── */
function updateAll() {
  state.label = document.getElementById('label-input').value || 'Button text';
  renderPreview();
  renderMatrix();
  updatePrompt();
}

/* ── init ── */
renderIconGrid();
updateAll();
</script>
