// ── Status indicator shape ────────────────────────────────────────────────────
const StatusShape = ({ status }) => {
  const color = STATUS_CFG[status]?.border || '#999';
  if (status === 'successful') return (
    <Box sx={{ width:10, height:10, bgcolor:color, transform:'rotate(45deg)', borderRadius:'1px', flexShrink:0 }} />
  );
  if (status === 'scheduled') return (
    <Box sx={{ width:10, height:10, borderRadius:'50%', bgcolor:color, flexShrink:0 }} />
  );
  if (status === 'draft') return (
    <Box sx={{ width:10, height:10, borderRadius:'50%', border:`1.5px solid ${color}`, flexShrink:0 }} />
  );
  if (status === 'failed') return (
    <Box sx={{ width:0, height:0, borderLeft:'5px solid transparent', borderRight:'5px solid transparent', borderBottom:`9px solid ${color}`, flexShrink:0 }} />
  );
  return null;
};

// ── Post card ─────────────────────────────────────────────────────────────────
const DEFAULT_VIEW_OPTS = { images:true, tags:true, slim:false, colored:false };
const PostCard = ({ card, onClick, viewOpts = DEFAULT_VIEW_OPTS }) => {
  const cfg = STATUS_CFG[card.s] || STATUS_CFG.draft;
  const showThumb = viewOpts.images;
  const cardBg = viewOpts.colored ? cfg.chipBg : '#fff';
  return (
    <Paper
      onClick={() => onClick && onClick(card)}
      elevation={0}
      sx={{
        border: `1px solid ${card.s === 'failed' ? cfg.border : '#e7eaee'}`,
        borderRadius: '8px',
        background: cardBg,
        cursor: 'pointer',
        flexShrink: 0,
        overflow: 'hidden',
        '&:hover': { boxShadow: '0 2px 8px rgba(0,0,0,.1)', borderColor: '#d3d7de' },
      }}
    >
      {/* Colored top accent bar */}
      <Box sx={{ height:3, bgcolor: cfg.border, borderRadius:'8px 8px 0 0' }} />
      {/* Status row */}
      <Box sx={{ display:'flex', alignItems:'center', gap:'5px', pt:'7px', px:'8px' }}>
        <Box sx={{ width:8, height:8, borderRadius:'50%', bgcolor: cfg.border, flexShrink:0 }} />
        <Typography sx={{ fontSize:11, fontWeight:600, color: cfg.chipText, flex:1, lineHeight:1 }}>
          {cfg.label}
        </Typography>
        <Typography sx={{ fontSize:'10.5px', color:'#848ea4', whiteSpace:'nowrap' }}>{card.t}</Typography>
      </Box>
      {/* Thumbnail */}
      {showThumb && (
        <Box sx={{ width:'100%', height:72, mt:'6px', display:'flex', alignItems:'center', justifyContent:'center', fontSize:24, background: card.bg }}>
          {card.emoji}
        </Box>
      )}
      {/* Body */}
      <Box sx={{ px:'8px', pt:'5px', pb:'7px' }}>
        <Typography sx={{ fontSize:'11.5px', fontWeight:500, lineHeight:1.4, color:'#111317', mb:'4px',
          display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', overflow:'hidden' }}>
          {card.title}
        </Typography>
        {/* Tags */}
        {viewOpts.tags && card.tags?.length > 0 && (
          <Box sx={{ display:'flex', flexWrap:'wrap', gap:'3px', mb:'5px' }}>
            {card.tags.map(([color, label], i) => {
              const tc = TAG_CFG[color] || TAG_CFG.grey;
              if (viewOpts.slim) {
                return <Box key={i} sx={{ display:'inline-block', width:36, height:4, borderRadius:2, bgcolor: tc.bg }} />;
              }
              return (
                <Box key={i} sx={{ display:'inline-flex', alignItems:'center', px:'6px', height:18, borderRadius:'3px', fontSize:10, fontWeight:500, bgcolor: tc.bg, color: tc.color }}>
                  {label}
                </Box>
              );
            })}
          </Box>
        )}
        {/* Networks */}
        {card.nets?.length > 0 && (
          <Box sx={{ display:'flex', gap:'3px', alignItems:'center' }}>
            {card.nets.map(n => {
              const Icon = NET_ICONS[n];
              return Icon ? <Box key={n} sx={{ display:'flex' }}><Icon /></Box> : null;
            })}
          </Box>
        )}
      </Box>
    </Paper>
  );
};

// ── Month timeline view ───────────────────────────────────────────────────────
const MonthTimeline = ({ onCardClick }) => {

    <Box sx={{ flex:1, overflowX:'auto', overflowY:'auto', minHeight:0, display:'flex', flexDirection:'column' }}>

        <Box sx={{ width:120, flexShrink:0, borderRight:'1px solid #e7eaee' }} />
        {Array.from({length:N},(_,k)=>k+1).map(d => {
          const dow = new Date(2025,5,d).getDay();

            <Box key={d} sx={{ width:36, flexShrink:0, borderRight:'1px solid #e7eaee', display:'flex', flexDirection:'column', alignItems:'center', py:'4px', gap:'2px', bgcolor: isToday ? 'rgba(19,57,236,0.04)' : 'transparent' }}>

              <Typography sx={{ fontSize:11, fontWeight: isToday ? 700 : 400, color: isToday ? '#1339ec' : '#5f6a82' }}>{d}</Typography>
            </Box>
          );
        })}
      </Box>
      {/* Campaign rows */}
      {CAMPS.map((c, ci) => (
        <Box key={ci} sx={{ display:'flex', flexShrink:0, height:28, borderBottom:'1px solid #e7eaee' }}>
          <Box sx={{ width:120, flexShrink:0, borderRight:'1px solid #e7eaee', px:1, display:'flex', alignItems:'center' }}>

// ── Date Range Picker Popover ─────────────────────────────────────────────────
const DateRangePicker = ({ anchorEl, open, onClose, panelRef }) => {
  const [range, setRange] = useState({ start: { y:2025, m:5, d:16 }, end: { y:2025, m:5, d:22 } });
  const DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const TODAY = { y:2025, m:5, d:18 };
  const MONTHS = [{ y:2025, m:5, label:'June 2025' }, { y:2025, m:6, label:'July 2025' }];

  const inRange = (y, m, d) => {
    const cur = y*10000+m*100+d, s = range.start.y*10000+range.start.m*100+range.start.d, e = range.end.y*10000+range.end.m*100+range.end.d;
    return cur >= s && cur <= e;
  };
  const isStart = (y,m,d) => y===range.start.y && m===range.start.m && d===range.start.d;
  const isEnd   = (y,m,d) => y===range.end.y   && m===range.end.m   && d===range.end.d;
  const isToday = (y,m,d) => y===TODAY.y && m===TODAY.m && d===TODAY.d;

  const handleDay = (y,m,d) => {
    const cur = {y,m,d};
    const curN = y*10000+m*100+d, startN = range.start.y*10000+range.start.m*100+range.start.d;
    if (curN < startN) setRange({start:cur, end:range.end});
    else setRange({...range, end:cur});
  };

  const renderMonth = (y, m) => {
    const first = new Date(y, m, 1).getDay();
    const days  = new Date(y, m+1, 0).getDate();
    const cells = [];
    DOW.forEach(dw => cells.push(<Box key={'h'+dw} sx={{ textAlign:'center', fontSize:10, fontWeight:600, color:'#848ea4', pb:'4px', textTransform:'uppercase' }}>{dw}</Box>));
    for (let i=0;i<first;i++) cells.push(<Box key={'e'+i} />);
    for (let d=1;d<=days;d++) {
      const start=isStart(y,m,d), end=isEnd(y,m,d), inR=inRange(y,m,d), today=isToday(y,m,d);
      cells.push(
        <Box key={d} onClick={() => handleDay(y,m,d)} sx={{
          height:28, display:'flex', alignItems:'center', justifyContent:'center',
          fontSize:12, cursor:'pointer', borderRadius: start||end ? '4px' : inR ? 0 : '4px',
          bgcolor: start||end ? '#1339ec' : inR ? '#eef3fd' : 'transparent',
          color: start||end ? '#fff' : today && !inR ? '#1339ec' : '#111317',
          fontWeight: (start||end||today) ? 700 : 400,
          '&:hover': { bgcolor: start||end ? '#0f2ebd' : '#dfe7fd' },
          ...(start ? { borderRadius:'4px 0 0 4px' } : {}),
          ...(end   ? { borderRadius:'0 4px 4px 0' } : {}),
        }}>{d}</Box>
      );
    }
    return cells;
  };

  return (
    <Box ref={panelRef} sx={{ position:'fixed', zIndex:300, bgcolor:'#fff', border:'1px solid #e7eaee', borderRadius:'10px', boxShadow:'0 8px 24px rgba(0,0,0,.14)', p:2, width:560, display: open ? 'block' : 'none',
      top: anchorEl ? anchorEl.getBoundingClientRect().bottom + 4 : 200,
      left: anchorEl ? anchorEl.getBoundingClientRect().left : 200,
    }}>
      <Box sx={{ display:'flex', gap:3 }}>
        {MONTHS.map(({ y, m, label }) => (
          <Box key={label} sx={{ flex:1 }}>
            <Box sx={{ display:'flex', alignItems:'center', justifyContent:'space-between', mb:'10px' }}>
              <Typography sx={{ fontSize:13, fontWeight:600, color:'#111317' }}>{label}</Typography>
            </Box>
            <Box sx={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:'1px' }}>
              {renderMonth(y, m)}
            </Box>
          </Box>
        ))}
      </Box>
      <Box sx={{ display:'flex', justifyContent:'flex-end', gap:1, mt:'14px', pt:'12px', borderTop:'1px solid #e7eaee' }}>
        <Button size="small" onClick={onClose} sx={{ textTransform:'none', fontSize:13, color:'#5f6a82', border:'1px solid #d3d7de', borderRadius:'6px' }}>Clear</Button>
        <Button size="small" variant="contained" onClick={onClose} sx={{ textTransform:'none', fontSize:13, borderRadius:'6px' }}>Apply</Button>
      </Box>
    </Box>
  );
};

    <Box sx={{ flex:1, overflowY:'auto' }}>
      {MAIN_NAV.map(({ section, items }, si) => (
        <Box key={si}>
          {si > 0 && <Divider sx={{ mx:2 }} />}
          {section && (
            <Typography sx={{ fontSize:10, fontWeight:700, color:'#848ea4', textTransform:'uppercase', letterSpacing:'0.06em', px:'20px', pt:'14px', pb:'4px' }}>
              {section}
            </Typography>
          )}
          {items.map(item => (
            <ListItemButton key={item.label} onClick={onClose} sx={{
              mx:'8px', borderRadius:'8px', px:'12px', py:'7px', mb:'1px',
              bgcolor: item.active ? 'rgba(19,57,236,.08)' : 'transparent',
              color: item.active ? '#1339ec' : '#111317',
              '&:hover': { bgcolor: item.active ? 'rgba(19,57,236,.08)' : '#f3f5f7' },
            }}>
              <ListItemIcon sx={{ minWidth:32 }}>
                <span className="material-icons" style={{fontSize:18, color: item.active ? '#1339ec' : '#5f6a82'}}>{item.icon}</span>
              </ListItemIcon>
              <ListItemText primary={item.label} primaryTypographyProps={{ fontSize:13, fontWeight: item.active ? 600 : 500, color: item.active ? '#1339ec' : '#111317' }} />
            </ListItemButton>
          ))}
        </Box>
      ))}
    </Box>
  </Drawer>
);

// ── App header ────────────────────────────────────────────────────────────────
const AppHeader = ({ onOpenMainNav }) => (
  <Box sx={{ height:56, flexShrink:0, bgcolor:'#111317', display:'flex', alignItems:'center', px:2, gap:'10px', zIndex:20 }}>
    <IconButton onClick={onOpenMainNav} sx={{ width:36, height:36, borderRadius:'8px', color:'#5f6a82', '&:hover':{ bgcolor:'rgba(255,255,255,.1)', color:'#a7aebe' } }}>
      <span className="material-icons" style={{fontSize:20}}>menu</span>
    </IconButton>
    {/* Logo */}
    <Box sx={{ display:'flex', alignItems:'center', gap:'9px', flexShrink:0 }}>
      <Box sx={{ width:32, height:32, display:'flex', alignItems:'center', justifyContent:'center' }}>
        <Box sx={{ width:18, height:18, bgcolor:'#f97316', transform:'rotate(45deg)', borderRadius:'3px' }} />
      </Box>
      <Typography sx={{ fontSize:15, fontWeight:700, color:'#fff', letterSpacing:'-0.2px' }}>facelift</Typography>
    </Box>
    <Box sx={{ flex:1 }} />
    {/* Right icons */}
    <Box sx={{ display:'flex', alignItems:'center', gap:.25 }}>
      {['settings','help_outline','notifications'].map(icon => (
        <IconButton key={icon} size="small" sx={{ width:34, height:34, borderRadius:'8px', color:'#5f6a82', '&:hover':{ bgcolor:'rgba(255,255,255,.1)', color:'#a7aebe' } }}>
          <span className="material-icons" style={{fontSize:18}}>{icon}</span>
        </IconButton>
      ))}
      <Avatar sx={{ width:30, height:30, fontSize:11, fontWeight:700, bgcolor:'#0c228d', border:'1.5px solid #414858', ml:.75, cursor:'pointer' }}>SA</Avatar>
    </Box>
  </Box>
);

// ── App root ──────────────────────────────────────────────────────────────────
const App = () => {
  const [subNavOpen,    setSubNavOpen]    = useState(true);
  const [mainNavOpen,   setMainNavOpen]   = useState(false);
  const [weekOffset,    setWeekOffset]    = useState(0);
  const [viewMode,      setViewMode]      = useState('week');
  const [calView,       setCalView]       = useState('calendar');
  const [openPanel,     setOpenPanel]     = useState(null);
  const [selectedPost,  setSelectedPost]  = useState(null);
  const [datePickerOpen, setDatePickerOpen] = useState(false);
  const [viewOptsOpen,   setViewOptsOpen]   = useState(false);
  const [viewOpts,       setViewOpts]       = useState({ images:true, tags:true, slim:false, colored:false });
  const datePickerBtnRef   = useRef(null);
  const datePickerPanelRef = useRef(null);
  const viewOptsBtnRef     = useRef(null);
  const viewOptsPanelRef   = useRef(null);

  const wd = WEEKS.find(w => w.offset === weekOffset);
  const handleCardClick = card => { setSelectedPost(card); setOpenPanel('postDetail'); };
  const togglePanel = id => setOpenPanel(p => p === id ? null : id);

  // Close popovers on outside click — exclude both the button AND the panel
  React.useEffect(() => {
    const handler = e => {
      const inDateBtn   = datePickerBtnRef.current   && datePickerBtnRef.current.contains(e.target);
      const inDatePanel = datePickerPanelRef.current && datePickerPanelRef.current.contains(e.target);
      if (!inDateBtn && !inDatePanel) setDatePickerOpen(false);

      const inOptsBtn   = viewOptsBtnRef.current   && viewOptsBtnRef.current.contains(e.target);
      const inOptsPanel = viewOptsPanelRef.current && viewOptsPanelRef.current.contains(e.target);
      if (!inOptsBtn && !inOptsPanel) setViewOptsOpen(false);
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  return (
    <ThemeProvider theme={theme}>
      <CssBaseline />
      <Box sx={{ display:'flex', flexDirection:'column', height:'100vh', overflow:'hidden', minWidth:1280 }}>
        <AppHeader onOpenMainNav={() => setMainNavOpen(true)} />
        <Box sx={{ display:'flex', flex:1, overflow:'hidden' }}>
          <SubNav open={subNavOpen} onToggle={() => setSubNavOpen(o => !o)} />
          <Box component="main" sx={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', bgcolor:'#f3f5f7' }}>
            <PageTitleBar onOpenDrafts={() => togglePanel('drafts')} />
            <ToolbarRow
              wd={wd} weekOffset={weekOffset} viewMode={viewMode} calView={calView}
              onPrev={() => setWeekOffset(o => Math.max(-1, o - 1))}
              onNext={() => setWeekOffset(o => Math.min(1,  o + 1))}
              onToday={() => setWeekOffset(0)}
              onViewMode={setViewMode} onCalView={setCalView}
              onOpenSearch={() => togglePanel('search')}
              onOpenDrafts={() => togglePanel('drafts')}
              onOpenFilters={() => togglePanel('filters')}
              onToggleDatePicker={() => { setDatePickerOpen(o => !o); setViewOptsOpen(false); }}
              onToggleViewOptions={() => { setViewOptsOpen(o => !o); setDatePickerOpen(false); }}
              datePickerBtnRef={datePickerBtnRef}
              viewOptsBtnRef={viewOptsBtnRef}
            />
            <CalendarArea wd={wd} viewMode={viewMode} calView={calView} onCardClick={handleCardClick} viewOpts={viewOpts} />
          </Box>
        </Box>
      </Box>
      {/* Popovers */}
      <DateRangePicker anchorEl={datePickerBtnRef.current} open={datePickerOpen} onClose={() => setDatePickerOpen(false)} panelRef={datePickerPanelRef} />
      <ViewOptionsPopover anchorEl={viewOptsBtnRef.current} open={viewOptsOpen} onClose={() => setViewOptsOpen(false)} opts={viewOpts} onChange={setViewOpts} panelRef={viewOptsPanelRef} />
      {/* Main nav overlay */}
      <MainNavDrawer open={mainNavOpen} onClose={() => setMainNavOpen(false)} />
      {/* Side panels */}
      <PostDetailPanel open={openPanel === 'postDetail'} post={selectedPost} onClose={() => setOpenPanel(null)} />
      <SearchPanel  open={openPanel === 'search'}  onClose={() => setOpenPanel(null)} />
      <DraftsPanel  open={openPanel === 'drafts'}  onClose={() => setOpenPanel(null)} />
      <FiltersPanel open={openPanel === 'filters'} onClose={() => setOpenPanel(null)} />
    </ThemeProvider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
