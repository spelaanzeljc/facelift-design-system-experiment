<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Type=Changelog</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f0f0f0;padding:2rem;color:#111}
.page{max-width:1400px;margin:0 auto}
header{margin-bottom:1.25rem}
h1{font-size:1.25rem;font-weight:600;margin-bottom:.2rem}
h2{font-size:.9rem;font-weight:600;margin:1.25rem 0 .5rem;text-transform:uppercase;letter-spacing:.05em;color:#555}
.meta{font-size:.75rem;color:#888;font-family:monospace}
.desc{background:#fff;border-left:3px solid #ddd;padding:.5rem .75rem;font-size:.875rem;color:#555;margin:.75rem 0;border-radius:0 4px 4px 0}
.preview-wrap{background:#fff;border-radius:8px;padding:2rem;overflow:auto;margin-bottom:1.25rem;display:flex;align-items:flex-start;justify-content:flex-start;min-height:80px}
.checker{background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;border-radius:4px;display:inline-flex}
table{width:100%;border-collapse:collapse;font-size:.8rem;background:#fff;border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:.5rem .75rem;border-bottom:1px solid #eee}
th{background:#fafafa;font-weight:600;color:#555}
.tag{display:inline-block;background:#e0f2fe;color:#0369a1;border-radius:3px;padding:1px 5px;font-size:.7rem;margin:1px}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Type=Changelog</h1>
    <p class="meta">key: e03ed77ef78e4a0f0ee6c3630fa0fdfb99e16659 &nbsp;·&nbsp; 1280px × 102px</p>
  </header>
  
  <h2>Preview</h2>
  <div class="preview-wrap">
    <div class="checker"><div style="width:1280px;height:102px;background-color:#000000;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px;padding:32px 40px 32px 40px" data-name="Type=Changelog"><div style="width:28px;height:28px" data-name="Metadata / Symbol"><div style="position:absolute;left:3px;top:3px;width:21px;height:20px;border:1.75px solid #ffffff;box-sizing:border-box" data-name="Vector"></div></div><span style="flex:1;align-self:stretch;color:#ffffff;font-family:"Helvetica Neue", sans-serif;font-size:30px;font-weight:500;line-height:38px" data-name="Type">Changelog</span></div></div>
  </div>
  
</div>
</body>
</html>
